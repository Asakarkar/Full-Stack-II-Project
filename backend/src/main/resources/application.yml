spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: rankforge-api
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/rankforge?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Aditya1618aadi}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        type:
          preferred_uuid_jdbc_type: VARCHAR
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
rankforge:
  seed-demo-data: ${SEED_DEMO_DATA:true}
  jwt:
    secret: ${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LXNob3VsZC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25nLWZvci1oczI1NiE=}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  teacher:
    invitation-code: ${TEACHER_INVITATION_CODE:DEV-TEACHER-SECRET-KEY}
  points:
    max-per-transaction: ${MAX_POINTS_PER_TX:10000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
