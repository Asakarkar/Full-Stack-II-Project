spring:
  application:
    name: rankforge-api-test
  datasource:
    url: jdbc:h2:mem:rankforge_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        type:
          preferred_uuid_jdbc_type: VARCHAR
  flyway:
    enabled: true
    locations: classpath:db/migration
rankforge:
  seed-demo-data: false
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LXNob3VsZC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25nLWZvci1oczI1NiE=
    expiration-ms: 3600000
  teacher:
    invitation-code: DEV-TEACHER-SECRET-KEY
  points:
    max-per-transaction: 10000
  cors:
    allowed-origins: "*"
