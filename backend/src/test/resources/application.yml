spring:
  application:
    name: rankforge-api-test
  datasource:
    url: jdbc:h2:mem:rankforge_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
rankforge:
  seed-demo-data: false
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LXNob3VsZC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25nLWZvci1oczI1NiE=
    expiration-ms: 3600000
  teacher:
    invitation-code: DEV-TEACHER-SECRET-KEY
  points:
    max-per-transaction: 10000
  cors:
    allowed-origins: "*"
